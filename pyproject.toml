[project]
name = "quickly"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "httpx>=0.24",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=0.8",
    "asyncpg>=0.27",
    "psycopg2-binary>=2.9",
    "aiosqlite>=0.19",
    "msal>=1.24",
    "any-llm-sdk[all]>=1.9",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "cryptography>=41.0",
    "slowapi>=0.1.9",
    "dnspython>=2.8",
    "mcp>=1.2,<2",
]

[tool.vercel]
entrypoint = "main:app"
